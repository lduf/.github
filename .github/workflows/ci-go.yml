name: ci-go

# Qualité d'une app Go (ADR 0002) : exactement `just check` (gofmt, vet,
# golangci-lint, tests -race) ; build de l'image (sans push)
# en parallèle.
# Check requis : « ci / check ».
#
#   ci:
#     if: github.event_name == 'pull_request'
#     uses: lduf/.github/.github/workflows/ci-go.yml@main
#     permissions: { contents: read }
on:
  workflow_call:
    inputs:
      build_image:
        description: Construire l'image Docker (sans la pousser)
        type: boolean
        default: true
      golangci_lint_version:
        description: Version de golangci-lint
        type: string
        default: latest

jobs:
  just-check:
    name: just check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Installer golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ inputs.golangci_lint_version }}
          install-only: true
      - uses: extractions/setup-just@v4
      - name: just check
        run: just check

  # En parallèle de `just check` : le build de l'image n'en dépend pas.
  image:
    if: inputs.build_image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build de l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Check requis « ci / check » : vert seulement si `just check` et l'image
  # le sont (un job sauté compterait comme un succès pour GitHub).
  check:
    if: ${{ !cancelled() }}
    needs: [just-check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: just check et image
        env:
          CHECK: ${{ needs.just-check.result }}
          IMAGE: ${{ needs.image.result }}
          BUILD_IMAGE: ${{ inputs.build_image }}
        run: |
          expected=success; [ "$BUILD_IMAGE" = true ] || expected=skipped
          if [ "$CHECK" != success ] || [ "$IMAGE" != "$expected" ]; then
            echo "::error::just check : $CHECK, image : $IMAGE"
            exit 1
          fi
