name: pr-checks

# Contrôles communs à toutes les PR (voir docs/release.md et ADR 0003) :
#   1. titre au format Conventional Commits ;
#   2. description : sections Quoi / Pourquoi / Breaking ? remplies, et
#      « ! » dans le titre <=> paragraphe « BREAKING CHANGE: » ;
#   3. CHANGELOG.md non modifié ;
#   4. champ de version non modifié (le bot de release s'en charge) ;
#   4b. aucun secret dans les commits de la PR (gitleaks) ;
#   4c. ni commit de merge (mise à jour par rebase) ni marqueur de conflit
#       dans les fichiers modifiés ;
#   5. OpenAPI (optionnel) : un changement cassant détecté par oasdiff sans
#      « ! » fait échouer la CI ;
#   6. avertissements (non bloquants) : migration ajoutée ou variable
#      d'environnement supprimée sans « ! » ;
#   7. dépendances : une ligne « Dépend de : owner/repo#N » (ou #N, ou l'URL)
#      bloque le merge tant que la PR visée n'est pas mergée (ou l'issue
#      fermée). Label « blocked » posé et retiré en conséquence ;
#   8. labels (docs/gouvernance.md) : « type: … » et « breaking » d'après le
#      titre, « area: … » d'après les fichiers modifiés. Sans
#      `pull-requests: write`, simple avertissement.
#
# Appel : dans un workflow à part (.github/workflows/pr-checks.yml de l'app),
# seul à écouter edited et labeled/unlabeled : éditer le titre, la
# description ou les labels relance ce contrôle (un job léger), jamais la CI
# lourde (ADR 0009).
#   on:
#     pull_request:
#       types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]
#   jobs:
#     pr-checks:
#       uses: lduf/.github/.github/workflows/pr-checks.yml@main
#       permissions: { contents: read, pull-requests: write }
#       secrets: inherit   # optionnel : dépendances vers d'autres repos privés
# Le check requis par le ruleset s'appelle « pr-checks / checks ».
on:
  workflow_call:
    inputs:
      openapi_path:
        description: Spec OpenAPI committée à comparer avec oasdiff (vide = pas de contrôle)
        type: string
        default: ''
      env_example_path:
        description: Fichier d'exemple des variables d'environnement (suppression = avertissement)
        type: string
        default: .env.example

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY != '' }}
    steps:
      - name: Titre au format Conventional Commits
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            style
            revert
          requireScope: false

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Les repos privés d'un compte perso n'ont pas le secret scanning de
      # GitHub : gitleaks le remplace, sur les seuls commits de la PR. Faux
      # positif : l'empreinte dans .gitleaksignore (ou règle dans .gitleaks.toml).
      - name: Secrets dans les commits (gitleaks)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --no-banner --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}" .

      - name: Description, CHANGELOG et version
        if: ${{ !cancelled() }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ENV_EXAMPLE: ${{ inputs.env_example_path }}
        shell: python
        run: |
          import os, re, subprocess, sys, tomllib

          title = os.environ["PR_TITLE"]
          body = (os.environ.get("PR_BODY") or "").replace("\r\n", "\n")
          base, head = os.environ["BASE_SHA"], os.environ["HEAD_SHA"]
          errors: list[str] = []

          def err(msg: str) -> None:
              errors.append(msg)
              print(f"::error::{msg}")

          # --- 2. Description -------------------------------------------------
          clean = re.sub(r"<!--.*?-->", "", body, flags=re.S)
          # Tout ce qui suit une ligne « --- » (signature, pied ajouté par un bot)
          # est hors modèle : on l'ignore.
          clean = re.split(r"^-{3,}\s*$", clean, maxsplit=1, flags=re.M)[0]
          sections: dict[str, str] = {}
          for m in re.finditer(r"^##\s+(.+?)\s*$(.*?)(?=^##\s|\Z)", clean, flags=re.M | re.S):
              sections[m.group(1).strip().rstrip("?").strip().lower()] = m.group(2).strip()
          for name in ("quoi", "pourquoi", "breaking"):
              if not sections.get(name):
                  label = "Breaking ?" if name == "breaking" else name.capitalize()
                  err(f"Section « {label} » absente ou vide dans la description de la PR.")

          title_breaking = re.match(r"^\w+(\([^()]*\))?!:", title) is not None
          # commitizen lit chaque paragraphe du commit : un paragraphe qui commence
          # par « BREAKING CHANGE: » rend la release cassante.
          paragraphs = [p.strip() for p in clean.split("\n\n")]
          footers = [p for p in paragraphs if re.match(r"^BREAKING[ -]CHANGE:\s*\S", p)]
          breaking_section = sections.get("breaking", "")
          says_no = re.fullmatch(r"(non|no|aucun|none|-)\.?", breaking_section, flags=re.I) is not None

          if title_breaking and not footers:
              err("Titre avec « ! » : la section Breaking doit contenir un paragraphe "
                  "« BREAKING CHANGE: <description> ».")
          if footers and not title_breaking:
              err("La description contient « BREAKING CHANGE: » mais le titre n'a pas de « ! ».")
          if not title_breaking and breaking_section and not says_no:
              err("Section Breaking : écrire « Non », ou bien ajouter « ! » au titre et "
                  "un paragraphe « BREAKING CHANGE: ».")
          # Le corps du squash = la description. commitizen teste CHAQUE LIGNE du
          # commit contre son motif de bump : une ligne « feat: … », « xxx!: … » ou
          # « BREAKING CHANGE: … » ailleurs que dans le paragraphe Breaking prévu
          # fausserait la version (et le CHANGELOG). On les refuse toutes.
          bump_line = re.compile(r"^((BREAKING[\-\ ]CHANGE|feat|fix|perf)(\([^()\r\n]*\))?(!)?|\w+(\([^()\r\n]*\))?!):")
          allowed = {f.splitlines()[0] for f in footers}
          for line in body.splitlines():
              line = line.rstrip()
              if bump_line.match(line) and line not in allowed:
                  err(f"Ligne de description lue comme un commit par la release (« {line[:50]} ») : "
                      "la reformuler (ex. l'indenter ou la mettre entre backticks).")

          # --- 3. CHANGELOG ---------------------------------------------------
          changed = subprocess.run(
              ["git", "diff", "--name-only", f"{base}...{head}"],
              check=True, capture_output=True, text=True,
          ).stdout.split()
          if "CHANGELOG.md" in changed:
              err("CHANGELOG.md est modifié : il est généré par le bot de release, ne pas y toucher.")

          # --- 3b. Historique et conflits ------------------------------------
          # Pas de commit de merge dans la PR : on se met à jour par rebase
          # (docs/gouvernance.md). Vérifié sur les seuls commits de la PR, pas
          # sur l'historique de main.
          merges = subprocess.run(["git", "rev-list", "--merges", f"{base}..{head}"],
                                  check=True, capture_output=True, text=True).stdout.split()
          if merges:
              err(f"La PR contient {len(merges)} commit(s) de merge ({', '.join(m[:7] for m in merges)}) : "
                  "se mettre à jour par rebase (git rebase origin/main, puis git push --force-with-lease, "
                  "ou « Update with rebase » sur GitHub).")
          # Marqueurs de conflit laissés dans un fichier modifié (ex. PR copier update).
          touched = subprocess.run(["git", "diff", "--name-only", "--diff-filter=AM", f"{base}...{head}"],
                                   check=True, capture_output=True, text=True).stdout.split()
          marker = re.compile(r"^(<{7}|>{7})( |$)", re.M)
          for path in touched:
              blob = subprocess.run(["git", "show", f"{head}:{path}"], capture_output=True)
              if blob.returncode != 0 or b"\0" in blob.stdout[:8000]:
                  continue
              if marker.search(blob.stdout.decode("utf-8", "replace")):
                  err(f"{path} contient des marqueurs de conflit (<<<<<<< / >>>>>>>) : résoudre le conflit.")

          # --- 4. Champ de version --------------------------------------------
          # Comparer au point de divergence (merge-base) et non à la base actuelle :
          # une release survenue sur main après la création de la branche ne doit
          # pas être imputée à la PR.
          mb = subprocess.run(["git", "merge-base", base, head],
                              check=True, capture_output=True, text=True).stdout.strip()

          def show(rev: str, path: str) -> str | None:
              r = subprocess.run(["git", "show", f"{rev}:{path}"], capture_output=True, text=True)
              return r.stdout if r.returncode == 0 else None

          def toml_get(text: str | None, *keys: str) -> str | None:
              if text is None:
                  return None
              node: object = tomllib.loads(text)
              for k in keys:
                  if not isinstance(node, dict) or k not in node:
                      return None
                  node = node[k]
              return str(node)

          fields = [
              ("pyproject.toml", ("project", "version")),
              ("pyproject.toml", ("tool", "commitizen", "version")),
              ("Cargo.toml", ("package", "version")),
              ("Cargo.toml", ("workspace", "package", "version")),
              (".cz.toml", ("tool", "commitizen", "version")),
          ]
          for path, keys in fields:
              old, new = toml_get(show(mb, path), *keys), toml_get(show(head, path), *keys)
              if old != new and old is not None:
                  err(f"{path} : le champ {'.'.join(keys)} passe de {old} à {new}. "
                      "La version est calculée par le bot de release, ne pas la modifier.")
          old_v, new_v = show(mb, "VERSION"), show(head, "VERSION")
          if old_v is not None and (old_v or "").strip() != (new_v or "").strip():
              err("Le fichier VERSION est modifié : la version est calculée par le bot de release.")

          # --- 6. Avertissements ----------------------------------------------
          if not title_breaking:
              added = subprocess.run(
                  ["git", "diff", "--name-only", "--diff-filter=A", f"{base}...{head}"],
                  check=True, capture_output=True, text=True,
              ).stdout.split()
              migrations = [f for f in added if re.search(r"(^|/)(migrations|alembic/versions)/", f)]
              if migrations:
                  print(f"::warning::Migration ajoutée sans « ! » ({', '.join(migrations)}) : "
                        "vérifier qu'elle est rétrocompatible, sinon marquer la PR comme breaking.")
              env_path = os.environ.get("ENV_EXAMPLE", "")
              def env_keys(text: str | None) -> set[str]:
                  return {l.split("=", 1)[0].strip() for l in (text or "").splitlines()
                          if re.match(r"^\s*[A-Z][A-Z0-9_]*\s*=", l)}
              removed = env_keys(show(mb, env_path)) - env_keys(show(head, env_path)) if env_path else set()
              if removed:
                  print(f"::warning::Variables d'environnement supprimées ou renommées sans « ! » : "
                        f"{', '.join(sorted(removed))}. C'est un changement cassant pour le déploiement.")

          sys.exit(1 if errors else 0)

      # --- 5. OpenAPI (optionnel) ---------------------------------------------
      - name: Spec OpenAPI présente sur la base ?
        id: oas
        if: ${{ !cancelled() && inputs.openapi_path != '' }}
        env:
          SPEC: ${{ inputs.openapi_path }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "${BASE_SHA}:${SPEC}" 2>/dev/null && [ -f "$SPEC" ]; then
            echo "compare=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pas de spec ${SPEC} sur la base ou la PR : comparaison OpenAPI sautée."
          fi

      - name: oasdiff (changements cassants)
        id: oasdiff
        if: ${{ !cancelled() && steps.oas.outputs.compare == 'true' }}
        continue-on-error: true
        uses: oasdiff/oasdiff-action/breaking@v0.1.18
        with:
          base: ${{ github.event.pull_request.base.sha }}:${{ inputs.openapi_path }}
          revision: HEAD:${{ inputs.openapi_path }}
          fail-on: ERR
          # Pas d'envoi des specs au service en ligne d'oasdiff.
          review: false

      - name: Cassant sans « ! » ?
        if: ${{ !cancelled() && steps.oasdiff.outcome == 'failure' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$PR_TITLE" | grep -Eq '^[a-z]+(\([^()]*\))?!:'; then
            echo "::notice::oasdiff détecte un changement cassant, annoncé par « ! » : OK."
          else
            echo "::error::oasdiff détecte un changement cassant de l'API, mais le titre n'a pas de « ! » (voir les annotations de l'étape oasdiff)."
            exit 1
          fi

      # --- 7 et 8. Dépendances et labels ------------------------------------
      # Jeton de l'App (si le ci.yml passe `secrets: inherit`) : lit les PR des
      # autres repos privés du compte. Sinon, GITHUB_TOKEN : ce repo et les
      # repos publics seulement.
      - name: Jeton de lecture des dépendances
        id: app
        if: ${{ !cancelled() && env.HAS_APP_KEY == 'true' }}
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID || 'Iv23li1N00eylQ1llniH' }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Dépendances et labels
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import json, os, re, subprocess, sys, urllib.error, urllib.parse, urllib.request

          API = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          repo, number = os.environ["REPO"], int(os.environ["PR_NUMBER"])
          title = os.environ["PR_TITLE"]
          body = re.sub(r"<!--.*?-->", "", (os.environ.get("PR_BODY") or "").replace("\r\n", "\n"), flags=re.S)
          tokens = [t for t in (os.environ.get("APP_TOKEN"), os.environ["GH_TOKEN"]) if t]

          def call(method: str, path: str, token: str, data: object = None) -> object:
              req = urllib.request.Request(
                  f"{API}/{path}", method=method,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
                           "X-GitHub-Api-Version": "2022-11-28"},
              )
              with urllib.request.urlopen(req, timeout=20) as r:
                  raw = r.read()
              return json.loads(raw) if raw else None

          def read(path: str) -> dict | None:
              for token in tokens:
                  try:
                      return call("GET", path, token)  # type: ignore[return-value]
                  except urllib.error.HTTPError:
                      continue
              return None

          # --- 7. Dépendances ---------------------------------------------------
          dep_line = re.compile(r"^\s*[-*]?\s*(?:d[ée]pend(?:s)? (?:de|on)|bloqu[ée]e? par|blocked by)\s*:?\s*(.+)$", re.I | re.M)
          ref = re.compile(r"https://github\.com/([\w.-]+/[\w.-]+)/(?:pull|issues)/(\d+)|(?<![\w/])([\w.-]+/[\w.-]+)?#(\d+)")
          deps: list[tuple[str, int]] = []
          for line in dep_line.findall(body):
              for m in ref.finditer(line):
                  target = (m.group(1) or m.group(3) or repo, int(m.group(2) or m.group(4)))
                  if target != (repo, number) and target not in deps:
                      deps.append(target)

          blocking: list[str] = []
          for dep_repo, n in deps:
              name = f"{dep_repo}#{n}"
              pr = read(f"repos/{dep_repo}/pulls/{n}")
              if pr is not None:
                  if pr.get("merged_at"):
                      print(f"Dépendance {name} : mergée.")
                  elif pr.get("state") == "closed":
                      blocking.append(f"{name} est fermée sans merge : retirer la ligne « Dépend de » si elle n'a plus lieu d'être.")
                  else:
                      blocking.append(f"{name} n'est pas encore mergée.")
                  continue
              issue = read(f"repos/{dep_repo}/issues/{n}")
              if issue is None:
                  blocking.append(f"{name} illisible (n'existe pas, ou repo privé : passer `secrets: inherit` à pr-checks).")
              elif issue.get("state") != "closed":
                  blocking.append(f"{name} (issue) n'est pas encore fermée.")
              else:
                  print(f"Dépendance {name} : issue fermée.")
          for msg in blocking:
              print(f"::error::Dépendance : {msg} Relancer ce check une fois levée.")

          # --- 8. Labels --------------------------------------------------------
          TYPES = {"feat", "fix", "perf", "refactor", "docs", "test", "build", "ci", "chore", "style", "revert"}
          AREAS = [  # premier motif qui correspond, par fichier
              ("template", r"^\.copier-answers\.yml$"),
              ("ci", r"^\.github/"),
              ("docs", r"^docs/|^mkdocs\.yml$|\.md$|^\.claude/"),
              ("api", r"(^|/)openapi\.(json|ya?ml)$"),
              ("observability", r"^observability/|(^|/)(metrics|logs|logging)(\.py|\.go|\.rs|/)"),
              ("db", r"(^|/)migrations/|alembic|(^|/)db(\.py|\.go|\.rs|/)"),
              ("auth", r"(^|/)auth[^/]*\.(py|go|rs)$|(^|/)auth/"),
              ("tests", r"^tests?/|_test\.go$|(^|/)test_[^/]*\.py$|(^|/)conftest\.py$"),
              ("deps", r"(^|/)(pyproject\.toml|uv\.lock|requirements[^/]*\.txt|go\.mod|go\.sum|Cargo\.toml|Cargo\.lock"
                       r"|package(-lock)?\.json|pnpm-lock\.yaml|yarn\.lock|renovate\.json|deny\.toml|rust-toolchain\.toml)$"),
              ("deploy", r"(^|/)(Dockerfile[^/]*|\.dockerignore|compose[^/]*\.ya?ml)$"),
              ("front", r"(^|/)(templates|static|web|frontend|ui|assets)/|\.(html|css|scss|js|mjs|ts|tsx|jsx|vue|svelte)$"),
              ("back", r"^(src|cmd|internal|app|pkg|lib)/"),
          ]
          m = re.match(r"^(\w+)(\([^()]*\))?(!)?:", title)
          wanted = set()
          if m and m.group(1) in TYPES:
              wanted.add(f"type: {m.group(1)}")
          if m and m.group(3):
              wanted.add("breaking")
          if blocking:
              wanted.add("blocked")
          files = subprocess.run(["git", "diff", "--name-only", f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}"],
                                 check=True, capture_output=True, text=True).stdout.split()
          for f in files:
              area = next((a for a, rx in AREAS if re.search(rx, f)), None)
              if area:
                  wanted.add(f"area: {area}")

          def managed(label: str) -> bool:
              return label.startswith(("type: ", "area: ")) or label in {"breaking", "blocked"}

          token = os.environ["GH_TOKEN"]
          try:
              current = {l["name"] for l in call("GET", f"repos/{repo}/issues/{number}/labels?per_page=100", token)}  # type: ignore[union-attr]
              for label in sorted({l for l in current if managed(l)} - wanted):
                  call("DELETE", f"repos/{repo}/issues/{number}/labels/{urllib.parse.quote(label, safe='')}", token)
              if wanted - current:
                  call("POST", f"repos/{repo}/issues/{number}/labels", token, {"labels": sorted(wanted - current)})
              print(f"Labels : {', '.join(sorted(wanted)) or 'aucun'}")
          except urllib.error.HTTPError as e:
              print(f"::warning::Labels non posés ({e.code}) : donner `pull-requests: write` à pr-checks dans le ci.yml. Attendus : {', '.join(sorted(wanted))}")

          sys.exit(1 if blocking else 0)
