name: ci-rust

# Qualité d'une app Rust (ADR 0002) : exactement `just check` (rustfmt,
# clippy -D warnings, cargo-deny, nextest), puis build de l'image (sans push).
# Check requis : « ci / check ».
#
#   ci:
#     if: github.event_name == 'pull_request'
#     uses: lduf/.github/.github/workflows/ci-rust.yml@main
#     permissions: { contents: read }
on:
  workflow_call:
    inputs:
      build_image:
        description: Construire l'image Docker (sans la pousser)
        type: boolean
        default: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,just
      - name: just check
        run: just check
      - uses: docker/setup-buildx-action@v4
        if: inputs.build_image
      - name: Build de l'image
        if: inputs.build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
