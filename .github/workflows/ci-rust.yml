name: ci-rust

# Qualité d'une app Rust (ADR 0002) : exactement `just check` (rustfmt,
# clippy -D warnings, cargo-deny, nextest), puis build de l'image (sans
# push), dans un seul job (ADR 0009 : chaque job est facturé à la minute
# entamée). Check requis : « ci / check ».
#
# Appel (dans le ci.yml de l'app, PR hors brouillon seulement) :
#   ci:
#     if: github.event_name == 'pull_request' && !github.event.pull_request.draft
#     uses: lduf/.github/.github/workflows/ci-rust.yml@main
#     permissions: { contents: read }
on:
  workflow_call:
    inputs:
      build_image:
        description: Construire l'image Docker (sans la pousser)
        type: boolean
        default: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      # Toolchain épinglée par le projet (rust-toolchain.toml, composants compris) :
      # pas de stable en plus, que rustup remplacerait de toute façon.
      - name: Toolchain Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,just
      - name: just check
        run: just check
      # Build de l'image (sans push) dans le même job : un seul démarrage de
      # runner et une seule minute arrondie au lieu de trois jobs parallèles.
      - uses: docker/setup-buildx-action@v4
        if: inputs.build_image
      - name: Build de l'image
        if: inputs.build_image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
