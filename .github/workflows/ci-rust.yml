name: ci-rust

# Qualité d'une app Rust (ADR 0002) : exactement `just check` (rustfmt,
# clippy -D warnings, cargo-deny, nextest) ; build de l'image (sans push)
# en parallèle.
# Check requis : « ci / check ».
#
#   ci:
#     if: github.event_name == 'pull_request'
#     uses: lduf/.github/.github/workflows/ci-rust.yml@main
#     permissions: { contents: read }
on:
  workflow_call:
    inputs:
      build_image:
        description: Construire l'image Docker (sans la pousser)
        type: boolean
        default: true

jobs:
  just-check:
    name: just check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Toolchain épinglée par le projet (rust-toolchain.toml, composants compris) :
      # pas de stable en plus, que rustup remplacerait de toute façon.
      - name: Toolchain Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-deny,just
      - name: just check
        run: just check

  # En parallèle de `just check` : le build de l'image n'en dépend pas.
  image:
    if: inputs.build_image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build de l'image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Check requis « ci / check » : vert seulement si `just check` et l'image
  # le sont (un job sauté compterait comme un succès pour GitHub).
  check:
    if: ${{ !cancelled() }}
    needs: [just-check, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: just check et image
        env:
          CHECK: ${{ needs.just-check.result }}
          IMAGE: ${{ needs.image.result }}
          BUILD_IMAGE: ${{ inputs.build_image }}
        run: |
          expected=success; [ "$BUILD_IMAGE" = true ] || expected=skipped
          if [ "$CHECK" != success ] || [ "$IMAGE" != "$expected" ]; then
            echo "::error::just check : $CHECK, image : $IMAGE"
            exit 1
          fi
