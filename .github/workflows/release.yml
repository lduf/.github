name: release

# Release automatique après merge sur main (ADR 0003 et 0004, docs/release.md).
#
# 1. Calcule le bump avec commitizen (config dans pyproject.toml ou .cz.toml de
#    l'app) depuis le dernier tag. Pas de commit qui bumpe => pas de release.
# 2. Pousse directement sur main le commit « chore(release): vX.Y.Z » et le tag,
#    avec le token de la GitHub App de release (seul acteur qui contourne le
#    ruleset).
# 3. Dans le même job (un push fait avec GITHUB_TOKEN ne déclenche aucun autre
#    workflow) : build et push de l'image GHCR X.Y.Z, X.Y, sha-<court>.
# 4. Déploie selon deploy_mode, sauf si une PR du lot porte le label no-deploy.
#    oikos-pr : PR sur lduf/oikos produite par son platform/release/apply.py,
#    fusionnée automatiquement dès que la CI d'Oikos est verte (ADR 0011
#    d'Oikos) ; le merge déploie (doco-cd).
#
# Appel (dans le ci.yml de l'app) :
#   release:
#     if: github.event_name != 'pull_request'
#     uses: lduf/.github/.github/workflows/release.yml@main
#     permissions: { contents: read, packages: write, pull-requests: read }
#     with: { redeploy_version: "${{ inputs.version }}" }
#     secrets: inherit
on:
  workflow_call:
    inputs:
      deploy_mode:
        description: portainer-webhook | oikos-pr | none
        type: string
        default: portainer-webhook
      branch:
        description: Branche de release
        type: string
        default: main
      build_image:
        description: Construire et pousser une image GHCR
        type: boolean
        default: true
      context:
        description: Contexte du build Docker
        type: string
        default: .
      dockerfile:
        description: Chemin du Dockerfile
        type: string
        default: Dockerfile
      stack:
        description: "oikos-pr : dossier stacks/<stack> d'Oikos (par défaut, nom du repo)"
        type: string
        default: ''
      oikos_repo:
        description: "oikos-pr : nom du repo Oikos, chez le même propriétaire"
        type: string
        default: oikos
      redeploy_version:
        description: Redéployer une version existante (X.Y.Z) sans bump ni build — workflow_dispatch
        type: string
        default: ''
      release_app_client_id:
        description: Client ID de la GitHub App de release (par défaut, variable de repo RELEASE_APP_CLIENT_ID)
        type: string
        default: ''
      commitizen_version:
        description: Version de commitizen
        type: string
        default: 4.19.0
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        required: true
      PORTAINER_WEBHOOK_URL:
        required: false
    outputs:
      released:
        description: "true si une nouvelle version a été publiée"
        value: ${{ jobs.release.outputs.released }}
      version:
        description: Version publiée ou redéployée
        value: ${{ jobs.release.outputs.version }}
      deployed:
        description: "true si l'étape de déploiement a été exécutée"
        value: ${{ jobs.release.outputs.deployed }}
      oikos_pr:
        description: "oikos-pr : URL de la PR de release sur Oikos"
        value: ${{ jobs.release.outputs.oikos_pr }}

jobs:
  release:
    # Anti-boucle : le commit du bot redéclenche « push: main », on l'ignore.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Merges rapprochés : les runs se suivent sans s'annuler ; un run en attente
    # remplacé par un plus récent est sans perte, car chaque run relit main.
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      released: ${{ steps.bump.outputs.released }}
      version: ${{ steps.bump.outputs.version || steps.redeploy.outputs.version }}
      deployed: ${{ steps.deploy.outputs.deployed || steps.oikos.outputs.deployed }}
      oikos_pr: ${{ steps.oikos.outputs.pr }}
    env:
      BRANCH: ${{ inputs.branch }}
      DEPLOY_MODE: ${{ inputs.deploy_mode }}
    steps:
      - name: Vérifier la configuration
        env:
          CLIENT_ID: ${{ inputs.release_app_client_id || vars.RELEASE_APP_CLIENT_ID }}
          BUILD_IMAGE: ${{ inputs.build_image }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::Variable de repo RELEASE_APP_CLIENT_ID absente : lancer scripts/setup-repo.sh (lduf/.github) sur ce repo."
            exit 1
          fi
          case "$DEPLOY_MODE" in
            portainer-webhook|oikos-pr|none) ;;
            *) echo "::error::deploy_mode inconnu : $DEPLOY_MODE"; exit 1 ;;
          esac
          if [ "$DEPLOY_MODE" = oikos-pr ] && [ "$BUILD_IMAGE" != true ]; then
            echo "::error::deploy_mode=oikos-pr déploie une image : build_image doit rester à true."
            exit 1
          fi

      - name: Token de la GitHub App de release
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.release_app_client_id || vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout (branche à jour, historique complet)
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}

      - name: Identité git du bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          user_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"

      - name: Set up uv
        if: inputs.redeploy_version == ''
        uses: astral-sh/setup-uv@v10.2.0

      - name: Bump, CHANGELOG, commit et tag
        id: bump
        if: inputs.redeploy_version == ''
        env:
          CZ: uvx --from commitizen==${{ inputs.commitizen_version }} cz
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            # Toujours repartir de la branche distante à jour : un autre merge a
            # pu arriver pendant l'attente du verrou de concurrence.
            git fetch --force --tags origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            prev_tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            before=$(git rev-parse HEAD)
            # 3 = NO_COMMITS_FOUND (tout est déjà publié, ex. run suivant un lot regroupé),
            # 21 = NO_COMMITS_TO_BUMP (rien qui justifie une release).
            $CZ --no-raise 3,21 bump --yes
            if [ "$(git rev-parse HEAD)" = "$before" ]; then
              echo "::notice::Aucun commit feat/fix/perf/breaking depuis ${prev_tag:-le début} : pas de release."
              echo "released=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            version=$($CZ version --project)
            # Push atomique en fast-forward strict : refusé si la branche a bougé.
            if git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/v$version"; then
              {
                echo "released=true"
                echo "version=$version"
                echo "prev_tag=$prev_tag"
                echo "sha=$(git rev-parse HEAD)"
                echo "short_sha=$(git rev-parse --short=7 HEAD)"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::Push refusé (tentative $attempt), la branche a bougé : nouveau calcul."
            git tag -d "v$version"
            sleep $((attempt * 5))
          done
          echo "::error::Impossible de pousser la release après 3 tentatives."
          exit 1

      - name: Redéploiement d'une version existante
        id: redeploy
        if: inputs.redeploy_version != ''
        env:
          VERSION: ${{ inputs.redeploy_version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION#v}"
          git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null \
            || { echo "::error::Tag v$VERSION introuvable."; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Label no-deploy dans le lot ?
        id: lot
        if: steps.bump.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PREV_TAG: ${{ steps.bump.outputs.prev_tag }}
        run: |
          set -euo pipefail
          # Commits du lot = depuis le tag précédent, sans le commit de release.
          range="${PREV_TAG:+$PREV_TAG..}HEAD~1"
          deploy=true
          prs=""
          for sha in $(git rev-list "$range"); do
            pulls=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
                      --jq '.[] | [(.number|tostring), ([.labels[].name] | join(","))] | @tsv')
            while IFS=$'\t' read -r number labels; do
              [ -z "$number" ] && continue
              prs="$prs #$number"
              if printf '%s\n' "$labels" | tr ',' '\n' | grep -qx 'no-deploy'; then
                echo "::notice::La PR #$number porte no-deploy : le lot n'est pas déployé."
                deploy=false
              fi
            done <<< "$pulls"
          done
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

      - name: Nom de l'image
        id: image
        if: inputs.build_image && (steps.bump.outputs.released == 'true' || steps.redeploy.outputs.version != '')
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        if: steps.image.outputs.name != ''
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        if: steps.image.outputs.name != ''
        uses: docker/setup-buildx-action@v4

      - name: Tags et labels de l'image
        id: meta
        if: steps.image.outputs.name != '' && steps.bump.outputs.released == 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=v${{ steps.bump.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ steps.bump.outputs.version }}
            type=raw,value=sha-${{ steps.bump.outputs.short_sha }}
            type=raw,value=latest,enable=${{ inputs.deploy_mode == 'portainer-webhook' && steps.lot.outputs.deploy == 'true' }}

      - name: Build et push
        id: build
        if: steps.meta.outcome == 'success'
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.bump.outputs.version }}
            COMMIT=${{ steps.bump.outputs.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Redéploiement — latest pointe sur la version demandée
        if: steps.image.outputs.name != '' && steps.redeploy.outputs.version != '' && inputs.deploy_mode == 'portainer-webhook'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.redeploy.outputs.version }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:$VERSION"

      - name: Déploiement
        id: deploy
        if: (steps.lot.outputs.deploy == 'true' || steps.redeploy.outputs.version != '') && inputs.deploy_mode != 'oikos-pr'
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          case "$DEPLOY_MODE" in
            portainer-webhook)
              if [ -z "$WEBHOOK" ]; then
                echo "::warning::Secret PORTAINER_WEBHOOK_URL absent : déploiement simulé (latest a bien bougé)."
              else
                curl -fsS -X POST --retry 3 --max-time 30 "$WEBHOOK" >/dev/null
              fi
              echo "deployed=true" >> "$GITHUB_OUTPUT" ;;
            none)
              echo "deployed=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # --- oikos-pr : PR de release sur Oikos, fusionnée automatiquement -----
      # Format de la PR : platform/release/apply.py d'Oikos (ADR 0009 d'Oikos).
      # Fusion : auto-merge dès que les checks requis d'Oikos passent, sans
      # revue humaine (ADR 0011 d'Oikos). Le merge déploie (doco-cd).
      - name: Oikos — token de la GitHub App de release
        id: oikos_app
        if: inputs.deploy_mode == 'oikos-pr' && (steps.lot.outputs.deploy == 'true' || steps.redeploy.outputs.version != '')
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ inputs.release_app_client_id || vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ inputs.oikos_repo }}
          permission-contents: write
          permission-pull-requests: write

      - name: Oikos — checkout
        if: steps.oikos_app.outcome == 'success'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/${{ inputs.oikos_repo }}
          path: .oikos
          token: ${{ steps.oikos_app.outputs.token }}

      - name: Oikos — set up uv
        if: steps.oikos_app.outcome == 'success'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          working-directory: .oikos

      - name: Oikos — PR de release
        id: oikos
        if: steps.oikos_app.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.oikos_app.outputs.token }}
          OIKOS: ${{ github.repository_owner }}/${{ inputs.oikos_repo }}
          STACK: ${{ inputs.stack }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.bump.outputs.version || steps.redeploy.outputs.version }}
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
          REDEPLOY: ${{ steps.redeploy.outputs.version }}
        run: |
          set -euo pipefail
          app="${GITHUB_REPOSITORY#*/}"
          stack="${STACK:-$app}"
          if [ -n "$REDEPLOY" ]; then
            # Version existante : observability/ et sha du tag, digest du registre.
            git checkout -q "v$VERSION"
            digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' | tr -d '"')
          else
            digest="$BUILD_DIGEST"
          fi
          [ -n "$digest" ] || { echo "::error::Digest de $IMAGE:$VERSION introuvable."; exit 1; }
          source="$GITHUB_REPOSITORY@$(git rev-parse --short=7 HEAD)"

          cd .oikos
          out="$RUNNER_TEMP/oikos-release.env"
          : > "$out"
          uv run --frozen platform/release/apply.py --stack "$stack" --app "$app" --image "$IMAGE" \
            --version "$VERSION" --digest "$digest" --observability "$GITHUB_WORKSPACE/observability" \
            --source "$source" --github-output "$out"
          changed=$(sed -n 's/^changed=//p' "$out")
          branch=$(sed -n 's/^branch=//p' "$out")
          title=$(sed -n 's/^title=//p' "$out")
          body_file="$RUNNER_TEMP/oikos-release-body.md"
          awk '/^body<</ { d = substr($0, 7); f = 1; next } f && $0 == d { f = 0 } f' "$out" > "$body_file"
          if [ "$changed" != true ]; then
            echo "::notice::$IMAGE:$VERSION déjà en place dans Oikos : pas de PR."
            echo "deployed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "$(git -C "$GITHUB_WORKSPACE" config user.name)"
          git config user.email "$(git -C "$GITHUB_WORKSPACE" config user.email)"
          git switch -q -c "$branch"
          git add -A
          git commit -q -m "$title" -m "$(cat "$body_file")"
          git push -q --force origin "HEAD:refs/heads/$branch"

          pr=$(gh pr list -R "$OIKOS" --head "$branch" --state open --json url --jq '.[0].url // ""')
          if [ -z "$pr" ]; then
            pr=$(gh pr create -R "$OIKOS" --base main --head "$branch" --title "$title" --body-file "$body_file")
          fi

          # Une release plus récente remplace les PR de release encore ouvertes de la même app.
          gh pr list -R "$OIKOS" --state open --json number,headRefName \
              --jq ".[] | select(.headRefName | startswith(\"release/$app-\")) | select(.headRefName != \"$branch\") | .number" \
            | while read -r old; do
                gh pr close -R "$OIKOS" "$old" --delete-branch --comment "Remplacée par $pr."
              done

          # Méthode de merge autorisée par Oikos, squash de préférence.
          method=$(gh repo view "$OIKOS" --json squashMergeAllowed,mergeCommitAllowed,rebaseMergeAllowed \
            --jq 'if .squashMergeAllowed then "squash" elif .mergeCommitAllowed then "merge" else "rebase" end')
          if ! gh pr merge -R "$OIKOS" "$pr" --auto "--$method"; then
            echo "::error::Auto-merge refusé sur $pr : activer « Allow auto-merge » sur $OIKOS (docs/deploiement.md §11.1 d'Oikos). La PR reste ouverte : la fusionner à la main déploie."
            exit 1
          fi
          echo "::notice::PR de release : $pr (fusion automatique quand la CI d'Oikos est verte)."
          {
            echo "deployed=true"
            echo "pr=$pr"
          } >> "$GITHUB_OUTPUT"

      - name: Résumé
        if: always()
        env:
          RELEASED: ${{ steps.bump.outputs.released }}
          VERSION: ${{ steps.bump.outputs.version || steps.redeploy.outputs.version }}
          PREV_TAG: ${{ steps.bump.outputs.prev_tag }}
          PRS: ${{ steps.lot.outputs.prs }}
          LOT_DEPLOY: ${{ steps.lot.outputs.deploy }}
          DEPLOYED: ${{ steps.deploy.outputs.deployed || steps.oikos.outputs.deployed }}
          OIKOS_PR: ${{ steps.oikos.outputs.pr }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "## Release"
            if [ -n "$VERSION" ] && [ "$RELEASED" != "true" ]; then
              echo "Redéploiement de **v$VERSION** (sans bump ni build)."
            elif [ "$RELEASED" = "true" ]; then
              echo "Version **v$VERSION** (précédente : ${PREV_TAG:-aucune}). PR du lot :${PRS:- aucune}."
            else
              echo "Pas de release : aucun commit feat/fix/perf/breaking depuis le dernier tag."
            fi
            [ -n "$TAGS" ] && { echo; echo "Image :"; echo '```'; echo "$TAGS"; echo '```'; }
            [ "$LOT_DEPLOY" = "false" ] && echo "Label **no-deploy** dans le lot : déploiement sauté."
            echo "Déploiement (\`$DEPLOY_MODE\`) : ${DEPLOYED:-non}."
            if [ -n "$OIKOS_PR" ]; then echo "PR Oikos (fusion automatique si CI verte) : $OIKOS_PR"; fi
          } >> "$GITHUB_STEP_SUMMARY"
